<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gevoelskompas</title>
<meta name="description" content="Drie keer per dag inchecken met de vier B's: bang, boos, blij en bedroefd.">
<meta name="theme-color" content="#F4F2EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gevoelskompas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: one calm phone column, four tabs fixed at the bottom, check-in as a full-screen sheet. */
:root{
  --bg:#F4F2EE; --surface:#FFFFFF; --sunk:#E9E6DF; --ink:#15171C; --muted:#5E6168; --line:#E4E1DA; --invert:#15171C; --invert-fg:#F4F2EE; --invert-muted:#C3C5CB;
  --bang:#4F55C9; --boos:#C8461F; --blij:#E9B53C; --bedroefd:#2C6283;
  --bang-tint:#E7E8F8; --boos-tint:#F7E3DB; --blij-tint:#FBF0D3; --bedroefd-tint:#DCE8EF;
  --focus:#4F55C9;
  --display:'Space Grotesk', 'Avenir Next', system-ui, sans-serif;
  --text:'Inter', -apple-system, system-ui, sans-serif;
}
:root{color-scheme:light}
html,body{height:100%}
body{margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand .mark{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-0.02em}
.brand .date{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.done{background:var(--e);color:var(--e-fg);border-radius:28px;padding:28px 22px;display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.done .check{width:56px;height:56px;border-radius:28px;background:var(--e-fg);color:var(--e);display:flex;align-items:center;justify-content:center}
.done h2{font-size:34px;line-height:1.05}
.done p{margin:0;font-size:15px;opacity:.92}
.progress3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.progress3 div{background:var(--surface);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:500}
.progress3 span.sq{height:28px;border-radius:9px;background:var(--e)}
.progress3 span.sq.leeg{background:transparent;border:1.5px dashed var(--line)}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-0.02em;text-wrap:balance;margin:0}
.e-bang{--e:var(--bang);--e-fg:#FFFFFF;--e-tint:var(--bang-tint)}
.e-boos{--e:var(--boos);--e-fg:#FFFFFF;--e-tint:var(--boos-tint)}
.e-blij{--e:var(--blij);--e-fg:#15171C;--e-tint:var(--blij-tint)}
.e-bedroefd{--e:var(--bedroefd);--e-fg:#FFFFFF;--e-tint:var(--bedroefd-tint)}

.app{max-width:480px;margin:0 auto;min-height:100%;padding-left:max(18px, env(safe-area-inset-left,0px));padding-right:max(18px, env(safe-area-inset-right,0px));padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:120px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.title{font-size:32px;line-height:1.08}
.sub{color:var(--muted);font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:20px;padding:16px}

/* Today */
.hero{background:var(--invert);color:var(--invert-fg);border-radius:24px;padding:18px 20px;display:flex;gap:18px;align-items:center}
.hero b{font-family:var(--display);font-size:18px;font-weight:600;display:block}
.hero span{color:var(--invert-muted);font-size:13px}
.ring-track{stroke:var(--invert-muted);opacity:.45}
.moment{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;border:none;background:var(--surface);border-radius:20px;padding:16px}
.moment .sw{width:44px;height:44px;border-radius:14px;background:var(--e);flex-shrink:0}
.moment .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.moment .row{display:flex;justify-content:space-between;gap:10px}
.moment .row strong{font-weight:600}
.moment .meta{font-size:13px;color:var(--muted)}
.moment .note{font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.moment.empty{background:transparent;border:1.5px dashed var(--line);align-items:center}
.moment.empty .sw{background:var(--sunk);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.pill{height:44px;padding:0 18px;border-radius:22px;border:none;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.pill.dark{background:var(--invert);color:var(--invert-fg)}
.pill.light{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.pill.ghost{background:transparent;color:var(--muted)}

/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px max(12px, env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px, env(safe-area-inset-left,0px));z-index:5}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;justify-content:center;text-decoration:none;color:var(--muted);font-size:11px;font-weight:500}
nav.tabs a[aria-current="page"]{color:var(--ink);font-weight:600}

/* Segmented */
.seg{background:var(--sunk);border-radius:14px;padding:4px;display:grid;gap:4px}
.seg button{height:38px;border:none;border-radius:10px;background:transparent;color:var(--muted);font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.alarm[aria-pressed="true"]{background:var(--invert);color:var(--invert-fg)}

/* Overview */
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px}
.day small{font-size:11px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.dot{width:100%;max-width:30px;aspect-ratio:1;border-radius:9px;background:var(--e);display:block}
.dot.none{background:transparent;border:1.5px solid var(--line)}
.dot.future{background:transparent;border:1.5px dashed var(--line);opacity:.6}
.bar{display:flex;align-items:center;gap:10px}
.bar .lbl{width:78px;font-size:14px}
.bar .trk{flex:1;height:12px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bar .fill{height:100%;border-radius:6px;background:var(--e)}
.bar .n{width:30px;text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.insight{background:var(--invert);color:var(--invert-fg);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.insight .eyebrow{color:var(--invert-muted)}
.notecard{background:var(--surface);border-radius:16px;padding:14px;border-left:4px solid var(--e);display:flex;flex-direction:column;gap:4px}
.notecard .meta{font-size:12px;color:var(--muted);font-weight:600}
.empty-state{border:1.5px dashed var(--line);border-radius:20px;padding:20px;color:var(--muted);font-size:14px}

/* Forms */
.field{display:flex;flex-direction:column;gap:8px}
.field label,.lbl-strong{font-weight:600;font-size:15px}
textarea,input[type=text],input[type=date],select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;font-size:16px;line-height:1.45}
textarea{resize:none;min-height:96px}
input[type=time]{height:42px;border:none;background:var(--sunk);border-radius:12px;padding:0 10px;font-family:var(--display);font-size:20px;font-weight:600;min-width:104px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:54px;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:none}
.toggle input{width:22px;height:22px;accent-color:var(--ink);flex-shrink:0}
.toggle small{display:block;color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 15px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--invert);color:var(--invert-fg);border-color:var(--invert)}

/* Sheet */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .in{max-width:480px;margin:0 auto;min-height:100%;padding:calc(18px + env(safe-area-inset-top,0px)) max(18px, env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px, env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}
.sheet-top{display:flex;justify-content:space-between;align-items:center}
.iconbtn{width:44px;height:44px;border-radius:22px;border:none;background:var(--surface);display:flex;align-items:center;justify-content:center}
.emogrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.emo{height:104px;border-radius:22px;padding:16px;border:2px solid transparent;background:var(--e-tint);color:var(--ink);display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:2px;text-align:left;transition:transform .15s ease, box-shadow .15s ease}
.emo strong{font-family:var(--display);font-size:22px;font-weight:600}
.emo span{font-size:12px;opacity:.85}
.emo[aria-pressed="true"]{background:var(--e);color:var(--e-fg);box-shadow:0 10px 22px color-mix(in srgb, var(--e) 35%, transparent);transform:translateY(-1px)}
.lvls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.lvls button{height:48px;border-radius:14px;border:none;background:var(--surface);color:var(--muted);font-weight:600;font-size:16px}
.lvls button.on{background:var(--e, var(--invert));color:var(--e-fg, var(--invert-fg))}
.summary-chip{background:var(--e);color:var(--e-fg);border-radius:22px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.summary-chip strong{font-family:var(--display);font-size:26px;font-weight:600;display:block}
.pips{display:flex;gap:4px}
.pips i{width:10px;height:28px;border-radius:5px;background:currentColor;opacity:.3}
.pips i.on{opacity:1}
.actions{display:flex;gap:10px;margin-top:auto}
.actions .grow{flex:1;height:56px;border-radius:28px;font-size:16px}
.actions .pill{height:56px;border-radius:28px}
.pill:disabled{opacity:.4;cursor:not-allowed}
.confirm{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}

/* Summary preview */
.preview{background:var(--surface);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.stackbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--sunk)}
.stackbar span{background:var(--e)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:5px;background:var(--e);margin-right:6px}
.range{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--invert);color:var(--invert-fg);padding:12px 18px;border-radius:22px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app" id="view" aria-live="polite">
  <p class="eyebrow">Gevoelskompas</p>
  <h1 class="title">Even laden…</h1>
</div>

<nav class="tabs" aria-label="Hoofdmenu"><div class="in">
  <a href="#vandaag" data-tab="vandaag"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Vandaag</a>
  <a href="#overzicht" data-tab="overzicht"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Overzicht</a>
  <a href="#samenvatting" data-tab="samenvatting"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/></svg>Samenvatting</a>
  <a href="#herinneringen" data-tab="herinneringen"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>Herinneringen</a>
</div></nav>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Check-in"></div>
<div class="toast" id="toast" hidden></div>

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(() => {
const EMO = {
  bang:{naam:'Bang', sub:'onrustig, gespannen', hex:'#4F55C9'},
  boos:{naam:'Boos', sub:'geprikkeld, begrensd', hex:'#C8461F'},
  blij:{naam:'Blij', sub:'licht, energiek', hex:'#E9B53C'},
  bedroefd:{naam:'Bedroefd', sub:'zwaar, verdrietig', hex:'#2C6283'}
};
const EMO_KEYS = ['bang','boos','blij','bedroefd'];
const MOM = [{id:'ochtend',naam:'Ochtend'},{id:'middag',naam:'Middag'},{id:'avond',naam:'Avond'}];
const LICHAAM = ['Hoofd','Keel','Borst','Buik','Schouders','Handen'];
const NIVEAU = ['','Heel licht','Licht','Merkbaar','Sterk','Overweldigend'];
const DEF = {tijden:{ochtend:'08:30',middag:'13:00',avond:'21:00'}, vorm:{ochtend:'melding',middag:'melding',avond:'wekker'}, naam:''};
const LOGO = s => `<svg width="${s}" height="${s}" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="#E4E1DA" stroke-width="2"/><path d="M20 2 A18 18 0 0 1 38 20 L20 20 Z" fill="#E9B53C"/><path d="M38 20 A18 18 0 0 1 20 38 L20 20 Z" fill="#2C6283"/><path d="M20 38 A18 18 0 0 1 2 20 L20 20 Z" fill="#C8461F"/><path d="M2 20 A18 18 0 0 1 20 2 L20 20 Z" fill="#4F55C9"/><circle cx="20" cy="20" r="7" fill="#F4F2EE"/></svg>`;

const S = {days:{}, settings:JSON.parse(JSON.stringify(DEF)), view:'vandaag', periode:'week',
  sam:{keuze:'deze-week', van:'', tot:'', notities:true, lichaam:true}, draft:null, mode:'lokaal'};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const fmtLong = d => d.toLocaleDateString('nl-NL',{weekday:'long', day:'numeric', month:'long'});
const fmtShort = d => d.toLocaleDateString('nl-NL',{weekday:'short', day:'numeric', month:'short'});
const fmtDate = d => d.toLocaleDateString('nl-NL',{day:'numeric', month:'long', year:'numeric'});
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const nowTime = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const currentMoment = () => { const h = new Date().getHours(); return h < 12 ? 'ochtend' : h < 17 ? 'middag' : 'avond'; };
const entry = (k, m) => S.days[k]?.[m] || null;
function toast(t){ const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2200); }

/* ---------- storage: on this device only ---------- */
function lsGet(){ try { return JSON.parse(localStorage.getItem('gevoelskompas-v1') || 'null'); } catch(e){ return null; } }
function lsSet(){ try { localStorage.setItem('gevoelskompas-v1', JSON.stringify({days:S.days, settings:S.settings})); return true; } catch(e){ toast('Opslaan lukte niet. Is je opslag vol?'); return false; } }
function applyData(data){
  S.days = data.days || {};
  const st = data.settings || {};
  S.settings = {tijden:Object.assign({}, DEF.tijden, st.tijden), vorm:Object.assign({}, DEF.vorm, st.vorm), naam:st.naam ?? ''};
}
function init(){
  const local = lsGet();
  if (local) applyData(local);
  try { if (navigator.storage?.persist) navigator.storage.persist(); } catch(e){}
  route();
}
async function saveDay(k){
  if (S.days[k] && !Object.keys(S.days[k]).length) delete S.days[k];
  lsSet();
}
async function shareFile(blob, filename, title){
  const file = new File([blob], filename, {type: blob.type});
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file], title}); return true; }
    catch(e){ if (e && e.name === 'AbortError') return false; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  return true;
}
async function backup(){
  const data = JSON.stringify({app:'gevoelskompas', versie:1, gemaakt:new Date().toISOString(), days:S.days, settings:S.settings}, null, 1);
  await shareFile(new Blob([data], {type:'application/json'}), `Gevoelskompas back-up ${key(today())}.json`, 'Gevoelskompas back-up');
}
function restore(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || typeof d.days !== 'object') throw 0;
      const merged = Object.assign({}, S.days);
      Object.entries(d.days).forEach(([k, mom]) => { merged[k] = Object.assign({}, merged[k] || {}, mom); });
      applyData({days:merged, settings:d.settings || S.settings});
      lsSet(); render();
      toast(`Back-up teruggezet: ${Object.keys(d.days).length} dagen`);
    } catch(e){ toast('Dit bestand is geen Gevoelskompas-back-up.'); }
  };
  r.readAsText(file);
}
async function saveSettings(){
  lsSet();
  if (!db) return;
  try { await db.doc(`data/users/${uid}/instellingen`).set({soort:'instellingen', ...S.settings}); } catch(e){ toast('Opslaan lukte niet. Probeer het zo nog eens.'); }
}

/* ---------- routing ---------- */
const VIEWS = ['vandaag','overzicht','samenvatting','herinneringen'];
function route(){
  const h = location.hash.replace('#','');
  if (MOM.some(m => m.id === h)){ S.view = 'vandaag'; render(); openCheckin(key(today()), h); return; }
  S.view = VIEWS.includes(h) ? h : 'vandaag';
  render();
}
window.addEventListener('hashchange', route);

function render(){
  document.querySelectorAll('nav.tabs a').forEach(a => { if (a.dataset.tab === S.view) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  const v = $('#view');
  const brand = `<div class="brand"><span class="mark">${LOGO(30)}Gevoelskompas</span><span class="date">${today().toLocaleDateString('nl-NL',{day:'numeric', month:'short'})}</span></div>`;
  v.innerHTML = brand + ({vandaag:viewToday, overzicht:viewOverview, samenvatting:viewSummary, herinneringen:viewReminders})[S.view]();
}

/* ---------- Vandaag ---------- */
function viewToday(){
  const t = today(), k = key(t), h = new Date().getHours();
  const greet = h < 6 ? 'Goedenacht' : h < 12 ? 'Goedemorgen' : h < 18 ? 'Goedemiddag' : 'Goedenavond';
  const done = MOM.filter(m => entry(k, m.id)).length;
  const open = MOM.filter(m => !entry(k, m.id));
  const cur = currentMoment();
  const next = open.find(m => m.id === cur) || open[0];
  const headline = done === 3 ? 'Alle drie de momenten staan erin' : done === 0 ? 'Je dag begint hier' : `Nog ${3-done} ${3-done === 1 ? 'moment' : 'momenten'} vandaag`;

function grabText(){ const d = S.draft; if (!d) return; const w = $('#wat'), n = $('#nodig'); if (w) d.wat = w.value; if (n) d.nodig = n.value; }

/* ---------- Statistics ---------- */
function rangeDays(van, tot){ const out = []; for (let d = new Date(van); d <= tot; d = addDays(d,1)) out.push(new Date(d)); return out; }
function stats(days){
  const count = {bang:0,boos:0,blij:0,bedroefd:0}, perMom = {ochtend:{},middag:{},avond:{}}; let total = 0; const notes = [];
  days.forEach(dt => { const k = key(dt); MOM.forEach(m => { const e = entry(k, m.id); if (!e) return; total++; count[e.emo]++; perMom[m.id][e.emo] = (perMom[m.id][e.emo]||0)+1;
    if (e.wat || e.nodig) notes.push({dt, m, e}); }); });
  return {count, perMom, total, notes};
}
function patterns(st){
  const out = [];
  MOM.forEach(m => { const pm = st.perMom[m.id]; const best = Object.entries(pm).sort((a,b) => b[1]-a[1])[0];
    if (best && best[1] >= 2) out.push(`’s ${m.naam.toLowerCase() === 'ochtend' ? 'Ochtends' : m.naam.toLowerCase() === 'middag' ? 'Middags' : 'Avonds'} voel je je het vaakst <strong>${EMO[best[0]].naam.toLowerCase()}</strong> (${best[1]}×).`); });
  return out;
}

/* ---------- Samenvatting ---------- */
function samRange(){
  const t = today(), mon = addDays(t, -((t.getDay()+6)%7));
  const k = S.sam.keuze;
  if (k === 'deze-week') return [mon, addDays(mon,6)];
  if (k === 'vorige-week') return [addDays(mon,-7), addDays(mon,-1)];
  if (k === '30') return [addDays(t,-29), t];
  const van = S.sam.van ? parse(S.sam.van) : addDays(t,-6), tot = S.sam.tot ? parse(S.sam.tot) : t;
  return van <= tot ? [van, tot] : [tot, van];
}

function textSummary(){

  days.forEach(dt => { const k = key(dt); const parts = MOM.map(m => { const e = entry(k, m.id); return e ? `${m.naam.toLowerCase()} ${EMO[e.emo].naam.toLowerCase()} ${e.lvl}/5` : null; }).filter(Boolean);

  const need = h => { if (y + h > 280){ footer(); doc.addPage(); page++; y = 20; } };
  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...muted); doc.text('GEVOELSKOMPAS · OVERZICHT', M, y);
  if (S.settings.naam){ doc.setFont('helvetica','bold'); doc.setTextColor(...ink); doc.text(S.settings.naam, W-M, y, {align:'right'}); }
  y += 9; doc.setFontSize(20); doc.setTextColor(...ink); doc.text(`${fmtDate(van)} – ${fmtDate(tot)}`, M, y);
  y += 6; doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...muted);
  doc.text(`${st.total} check-ins · ${st.notes.length} met notitie · gemaakt op ${fmtDate(new Date())}`, M, y);
  y += 4; doc.setDrawColor(...ink); doc.setLineWidth(0.6); doc.line(M, y, W-M, y); y += 8;
  const bw = (W - 2*M - 3*4)/4;
  EMO_KEYS.forEach((x,i) => { const bx = M + i*(bw+4); const c = hexRgb(EMO[x].hex);
    doc.setFillColor(246,245,242); doc.roundedRect(bx, y, bw, 26, 2, 2, 'F'); doc.setFillColor(...c); doc.rect(bx, y, bw, 1.6, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...ink); doc.text(EMO[x].naam, bx+4, y+8);
    doc.setFontSize(18); doc.text(`${st.total ? Math.round(st.count[x]/st.total*100) : 0}%`, bx+4, y+17);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...muted); doc.text(`${st.count[x]} van ${st.total} momenten`, bx+4, y+22.5); });
  y += 34;
  const pats = patterns(st).map(p => p.replace(/<[^>]+>/g,'').replace('’','\''));
  if (pats.length){ doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...ink); doc.text('Patronen', M, y); y += 6;
    doc.setFont('helvetica','normal'); doc.setFontSize(10); pats.forEach(p => { doc.text(p, M, y); y += 5.5; }); y += 4; }
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...ink); doc.text('Per dag', M, y); y += 6;
  const cw = (W - 2*M - 26 - 3*3)/3;
  doc.setFontSize(7.5); doc.setTextColor(...muted); MOM.forEach((m,i) => doc.text(m.naam.toUpperCase(), M+26+i*(cw+3), y)); y += 3;
  days.forEach(dt => { const k = key(dt); need(9);
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...ink); doc.text(cap(fmtShort(dt)), M, y+5);
    MOM.forEach((m,i) => { const cx = M+26+i*(cw+3); const e = entry(k, m.id);
      doc.setFillColor(246,245,242); doc.roundedRect(cx, y, cw, 7.5, 1.5, 1.5, 'F');
      if (e){ doc.setFillColor(...hexRgb(EMO[e.emo].hex)); doc.circle(cx+4, y+3.75, 1.6, 'F');
        doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...ink); doc.text(EMO[e.emo].naam, cx+7.5, y+5);
        doc.setTextColor(...muted); doc.text(`${e.lvl}/5`, cx+cw-3, y+5, {align:'right'}); }
      else { doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(185,181,172); doc.text('–', cx+4, y+5); } });
    y += 9; });
  if (S.sam.notities && st.notes.length){ y += 5; need(14); doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...ink); doc.text('Notities', M, y); y += 6;
    st.notes.forEach(({dt,m,e}) => {
      const tw = W - 2*M - 6; doc.setFontSize(10);
      const body = [];
      if (e.wat) body.push(...doc.splitTextToSize(`Wat gebeurde er: ${e.wat}`, tw));
      if (e.nodig) body.push(...doc.splitTextToSize(`Wat had ik nodig: ${e.nodig}`, tw));
      const h = 8 + body.length*4.8 + 3; need(h);
      doc.setFillColor(246,245,242); doc.rect(M, y, W-2*M, h, 'F'); doc.setFillColor(...hexRgb(EMO[e.emo].hex)); doc.rect(M, y, 1.4, h, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(...muted);
      doc.text(`${cap(fmtShort(dt))} · ${m.naam.toLowerCase()} · ${EMO[e.emo].naam} ${e.lvl}/5${S.sam.lichaam && e.lichaam?.length ? ' · ' + e.lichaam.join(', ').toLowerCase() : ''}`, M+5, y+5.5);
      doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...ink); doc.text(body, M+5, y+10.5);
      y += h + 3; }); }
  footer();
  const blob = doc.output('blob');
  await shareFile(new Blob([blob], {type:'application/pdf'}), `Gevoelsoverzicht ${key(van)} tot ${key(tot)}.pdf`, 'Gevoelsoverzicht');
}

/* ---------- Herinneringen ---------- */
function viewReminders(){
  const vormen = [['melding','Melding'],['wekker','Wekker'],['uit','Uit']];
  return `
    <div class="stack" style="gap:4px"><h1 class="title">Herinneringen</h1><span class="sub">Kies per moment een tijd en hoe je eraan herinnerd wilt worden.</span></div>
    ${MOM.map(m => `
      <div class="card stack" style="gap:10px">
        <div style="display:flex;justify-content:space-between;align-items:center"><label for="t-${m.id}" class="lbl-strong">${m.naam}</label><input type="time" id="t-${m.id}" data-time="${m.id}" value="${S.settings.tijden[m.id]}"></div>
        <div class="seg" style="grid-template-columns:repeat(3,minmax(0,1fr))" role="group" aria-label="Soort herinnering ${m.naam.toLowerCase()}">
          ${vormen.map(([v,l]) => `<button class="${v === 'wekker' ? 'alarm' : ''}" data-act="vorm" data-m="${m.id}" data-v="${v}" aria-pressed="${S.settings.vorm[m.id] === v}">${l}</button>`).join('')}
        </div>
      </div>`).join('')}
    <div class="card stack" style="gap:8px">
      <strong>Zo werkt het in deze conceptversie</strong>
      <span class="sub">Je tijden bepalen de planning op Vandaag. De webversie kan zelf nog geen meldingen of wekkers afgaan; dat komt in de iPhone-app. Tot die tijd: een melding zet je in de Herinneringen-app, een wekker in de Klok-app, op dezelfde tijden.</span>
    </div>
    <div class="card stack" style="gap:10px">
      <strong>Je gegevens</strong>
      <span class="sub">Je check-ins staan alleen op deze iPhone. Maak af en toe een back-up en bewaar die in Bestanden of iCloud Drive.</span>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
        <button class="pill dark" data-act="backup">Back-up maken</button>
        <label class="pill light" for="herstel" style="cursor:pointer">Terugzetten</label>
      </div>
      <input type="file" id="herstel" accept="application/json,.json" hidden>
    </div>`;
}

/* ---------- page events ---------- */
$('#view').addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'checkin') return openCheckin(b.dataset.k, b.dataset.m);
  if (a === 'per'){ S.periode = b.dataset.v; return render(); }
  if (a === 'vorm'){ S.settings.vorm[b.dataset.m] = b.dataset.v; render(); toast(b.dataset.v === 'uit' ? 'Herinnering uit' : 'Opgeslagen'); return saveSettings(); }
  if (a === 'pdf') return makePdf();
  if (a === 'backup') return backup();
  if (a === 'copy'){ const t = textSummary();
    try { await navigator.clipboard.writeText(t); toast('Gekopieerd'); }
    catch(e){ const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('aria-label','Samenvatting als tekst'); ta.style.minHeight = '220px'; b.closest('div').after(ta); ta.focus(); ta.select(); toast('Selecteer en kopieer de tekst hieronder'); } }
});
$('#view').addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset.time){ if (el.value){ S.settings.tijden[el.dataset.time] = el.value; saveSettings(); toast('Tijd opgeslagen'); } }
  if (el.dataset.sam){ S.sam[el.dataset.sam] = el.value; render(); }
  if (el.dataset.samChk){ S.sam[el.dataset.samChk] = el.checked; }
  if (el.dataset.set === 'naam'){ S.settings.naam = el.value.trim(); saveSettings(); }
  if (el.id === 'herstel' && el.files[0]){ restore(el.files[0]); el.value = ''; }
});
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

init();
})();
</script>
